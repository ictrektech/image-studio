[project]
name = "image-studio"
version = "0.1.0"
description = "Image Studio backend (FastAPI)"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "huggingface_hub>=0.23.0",
]

[dependency-groups]
dev = ["pytest"]

# 本应用以目录形式运行（uvicorn app.main:app），不作为安装包构建。
[tool.uv]
package = false
