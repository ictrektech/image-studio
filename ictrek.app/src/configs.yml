configs:
  - name: MODEL_HUB_SHARED_MODELS_PATH
    type: path
    title:
      zh-CN: Model Hub 共享模型目录
      en: Model Hub Shared Models Path
    description:
      zh-CN: Model Hub 的共享根目录。安装时应选择与 Model Hub 相同的 NAS 公共目录；Image Studio 会读取其中由 Model Hub 拉取的 ModelScope 模型。
      en: Shared root directory managed by Model Hub. Select the same NAS public directory as Model Hub at install time. Image Studio reads ModelScope models pulled by Model Hub.
    default: /data/vos_workspace/model_hub
    hints: [com.ictrek.model.storage]

  - name: MODEL_HUB_API_URL
    type: string
    title:
      zh-CN: Model Hub API 地址
      en: Model Hub API URL
    description:
      zh-CN: VOS 网络内的 Model Hub 后端 API 地址，用于触发模型下载和同步。
      en: Model Hub backend API URL inside VOS network, used to trigger model pull and sync.
    default: http://model-hub-backend:5005

  - name: IMAGE_STUDIO_V_ROUTER_API_URL
    type: string
    title:
      zh-CN: V-Router API 地址
      en: V-Router API URL
    description:
      zh-CN: Image Studio 调用 V-Router 中已有生图/生视频模型的 API 地址；默认优先使用同一 VOS 网络内的 V-Router 别名。
      en: API URL used by Image Studio to call image/video generation models already configured in V-Router. Defaults to the V-Router alias on the same VOS network.
    default: http://v-router:8080

  - name: IMAGE_STUDIO_V_ROUTER_HOST_API_URL
    type: string
    title:
      zh-CN: V-Router 宿主机回退地址
      en: V-Router host fallback URL
    description:
      zh-CN: vos_default 内部别名不可达时使用的宿主机地址；默认访问 V-Router 暴露端口 22888。
      en: Host URL used when the vos_default aliases are unreachable. Defaults to V-Router's exposed port 22888.
    default: http://host.docker.internal:22888

  - name: IMAGE_STUDIO_V_ROUTER_BASE_URL
    type: string
    title:
      zh-CN: Image Studio 对 V-Router 暴露地址
      en: Image Studio URL for V-Router
    description:
      zh-CN: V-Router 自动发现或注册 Image Studio 本地 ready 模型时回调的 Image Studio 后端地址；不要填 V-Router 地址。
      en: Image Studio backend URL that V-Router uses when discovering or registering Image Studio's local ready models. Do not set this to the V-Router URL.
    default: http://image-studio-backend:5000

  - name: IMAGE_STUDIO_VOS_SSO_ENABLED
    type: boolean
    title:
      zh-CN: 启用 VOS 用户隔离
      en: Enable VOS User Isolation
    description:
      zh-CN: 打开后，前端会携带 VOS 当前用户 token，后端通过 VOS 校验后按用户隔离图片、任务和会话设置。
      en: When enabled, the frontend sends the current VOS user token and the backend verifies it with VOS before isolating images, jobs, and session settings by user.
    default: true

  - name: IMAGE_STUDIO_VOS_USERINFO_URL
    type: string
    title:
      zh-CN: VOS 旧版用户校验地址
      en: Legacy VOS User Check URL
    description:
      zh-CN: 留空即由应用按平台内部网关推导（VOS_HOST_GW_IP:VOS_API_GW_PORT_INTERNAL，默认 172.17.0.1:1182 + /v1000/user/check），无需记忆端口；仅在需要指向其它地址时填写。
      en: Leave blank to derive it from the platform internal gateway (VOS_HOST_GW_IP:VOS_API_GW_PORT_INTERNAL, default 172.17.0.1:1182 + /v1000/user/check). Set only to point at another address.
    default: ""

  - name: IMAGE_STUDIO_VOS_OIDC_USERINFO_URL
    type: string
    title:
      zh-CN: VOS OIDC 用户信息地址
      en: VOS OIDC Userinfo URL
    description:
      zh-CN: 留空即由应用按平台内部网关推导（默认 172.17.0.1:1182 + /v1000/oauth2/userinfo），用于 OIDC Fastpath token 校验；仅在需要指向其它地址时填写。
      en: Leave blank to derive it from the platform internal gateway (default 172.17.0.1:1182 + /v1000/oauth2/userinfo) for OIDC Fastpath token verification. Set only to point at another address.
    default: ""

  - name: SD_CPP_BIN
    type: string
    title:
      zh-CN: sd.cpp 命令
      en: sd.cpp Command
    description:
      zh-CN: 容器内 stable-diffusion.cpp CLI 路径；默认使用 PATH 中的 sd-cli。
      en: stable-diffusion.cpp CLI path inside the container; defaults to sd-cli in PATH.
    default: sd-cli

  - name: IMAGE_STUDIO_MAX_CONCURRENCY
    type: integer
    title:
      zh-CN: 最大并发生成数
      en: Maximum Concurrent Generations
    description:
      zh-CN: 同时运行的生成任务数量。显存较小设备建议保持 1。
      en: Number of simultaneous generation jobs. Keep 1 on smaller VRAM devices.
    default: 1
    minimum: 1
    maximum: 4

  - name: IMAGE_STUDIO_GENERATE_TIMEOUT_SECONDS
    type: integer
    title:
      zh-CN: 生成超时时间
      en: Generation Timeout
    description:
      zh-CN: 单个生成任务的最长运行秒数。
      en: Maximum runtime in seconds for one generation job.
    default: 900
    minimum: 60
    maximum: 7200
