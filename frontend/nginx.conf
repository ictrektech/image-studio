server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # VOS recognizes this MIME type for browser JavaScript modules at its HTTPS gateway.
  location ~ \.(js|mjs)$ {
    types { text/javascript js mjs; }
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-store";
    try_files $uri $uri/ /index.html;
  }
}
