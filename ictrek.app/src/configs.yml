configs:
  - name: IMAGE_STUDIO_DATA_PATH
    type: path
    title:
      zh-CN: Image Studio 数据目录
      en: Image Studio Data Path
    description:
      zh-CN: 保存用户会话、生成任务和输出文件。不同 VOS 用户会在该目录下自动分隔。
      en: Stores sessions, generation jobs, and output files. VOS users are separated automatically inside this path.
    default: /data/vos_workspace/image_studio
    hints: [com.ictrek.ai.generated-assets]

  - name: MODEL_HUB_SHARED_MODELS_PATH
    type: path
    title:
      zh-CN: Model Hub 共享模型目录
      en: Model Hub Shared Models Path
    description:
      zh-CN: Model Hub 的共享模型根目录。安装时应选择与 Model Hub 相同的 NAS 公共目录；Image Studio 读取其中的模型，并把 HuggingFace 直连下载的模型按 Model Hub 兼容布局写入该目录。
      en: Shared model root managed by Model Hub. Select the same NAS public directory as Model Hub at install time. Image Studio reads models from it and writes HuggingFace direct-download models into the same Model Hub compatible layout.
    default: /data/vos_workspace/model_hub
    hints: [com.ictrek.model.storage]

  - name: IMAGE_STUDIO_HF_ENDPOINT
    type: string
    title:
      zh-CN: HuggingFace 下载端点
      en: HuggingFace Download Endpoint
    description:
      zh-CN: Image Studio 直连下载模型时使用的 HF 端点，默认走 hf-mirror.com 镜像加速；直连环境可改为 https://huggingface.co。
      en: HF endpoint used by Image Studio direct model downloads. Defaults to the hf-mirror.com acceleration mirror; set to https://huggingface.co for direct access.
    default: https://hf-mirror.com


  - name: MODEL_HUB_API_URL
    type: string
    title:
      zh-CN: Model Hub API 地址
      en: Model Hub API URL
    description:
      zh-CN: VOS 网络内的 Model Hub 后端 API 地址，用于触发模型下载和同步。
      en: Model Hub backend API URL inside VOS network, used to trigger model pull and sync.
    default: http://model-hub-backend:5005

  - name: IMAGE_STUDIO_VOS_SSO_ENABLED
    type: boolean
    title:
      zh-CN: 启用 VOS 用户隔离
      en: Enable VOS User Isolation
    description:
      zh-CN: 打开后，前端会携带 VOS 当前用户 token，后端通过 VOS 校验后按用户隔离图片、任务和会话设置。
      en: When enabled, the frontend sends the current VOS user token and the backend verifies it with VOS before isolating images, jobs, and session settings by user.
    default: true

  - name: IMAGE_STUDIO_VOS_USERINFO_URL
    type: string
    title:
      zh-CN: VOS 旧版用户校验地址
      en: Legacy VOS User Check URL
    description:
      zh-CN: App 容器访问 VOS backend `/v1000/user/check` 的地址，用于旧版 VOS token 校验。
      en: URL for the app container to reach VOS backend `/v1000/user/check` for legacy VOS token verification.
    default: http://172.17.0.1:8105/v1000/user/check

  - name: IMAGE_STUDIO_VOS_OIDC_USERINFO_URL
    type: string
    title:
      zh-CN: VOS OIDC 用户信息地址
      en: VOS OIDC Userinfo URL
    description:
      zh-CN: App 容器访问 VOS backend `/v1000/oauth2/userinfo` 的地址，用于 OIDC Fastpath token 校验。
      en: URL for the app container to reach VOS backend `/v1000/oauth2/userinfo` for OIDC Fastpath token verification.
    default: http://172.17.0.1:8105/v1000/oauth2/userinfo

  - name: SD_CPP_BIN
    type: string
    title:
      zh-CN: sd.cpp 命令
      en: sd.cpp Command
    description:
      zh-CN: 容器内 stable-diffusion.cpp CLI 路径；默认使用 PATH 中的 sd-cli。
      en: stable-diffusion.cpp CLI path inside the container; defaults to sd-cli in PATH.
    default: sd-cli

  - name: IMAGE_STUDIO_MAX_CONCURRENCY
    type: integer
    title:
      zh-CN: 最大并发生成数
      en: Maximum Concurrent Generations
    description:
      zh-CN: 同时运行的生成任务数量。显存较小设备建议保持 1。
      en: Number of simultaneous generation jobs. Keep 1 on smaller VRAM devices.
    default: 1
    minimum: 1
    maximum: 4

  - name: IMAGE_STUDIO_GENERATE_TIMEOUT_SECONDS
    type: integer
    title:
      zh-CN: 生成超时时间
      en: Generation Timeout
    description:
      zh-CN: 单个生成任务的最长运行秒数。
      en: Maximum runtime in seconds for one generation job.
    default: 900
    minimum: 60
    maximum: 7200
