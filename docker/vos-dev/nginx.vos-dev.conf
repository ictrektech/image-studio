# VOS 联调（保真模式）：nginx 挂载 frontend/dist-vos 产物。
# 产物由 vite 以 base=/app/com.ictrek.image-studio/ 构建，资源引用都带该前缀，
# 用 alias 把前缀映射回产物根目录；SPA 路由兜底回 index.html（hash 路由）。
server {
    listen 80;
    root /usr/share/nginx/html;

    location /app/com.ictrek.image-studio/ {
        alias /usr/share/nginx/html/;
        index index.html;
        try_files $uri $uri/ /app/com.ictrek.image-studio/index.html;
    }
}
