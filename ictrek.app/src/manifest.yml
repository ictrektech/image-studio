id: com.ictrek.image-studio
name:
  zh-CN: Image Studio
  en: Image Studio
description:
  zh-CN: 基于 stable-diffusion.cpp 的本地图像生成工作台，提供生成 API、任务记录、模型管理和 Model Hub 路径接入。
  en: Local image generation workspace powered by stable-diffusion.cpp, with generation APIs, job history, model management, and Model Hub path integration.
version: __APP_VERSION__
author: ictrek
category: [ai]
icon: icon.png
arch: [amd64, arm64]

frontend:
  enabled: true
  basePath: /app/com.ictrek.image-studio

platform:
  version: ">=3.0.0"

dependencies:
  apps:
    - id: com.ictrek.v-scheduler
      version: latest
      optional: false

oauth2:
  client:
    id: com.ictrek.image-studio
    redirect_uris:
      - https://app.vos-platform.internal/callback
    grant_types:
      - authorization_code
      - refresh_token
    response_types:
      - code
    scopes:
      - openid
      - profile
      - email
    pkce_required: true
    token_endpoint_auth_method: none
    access_token_ttl: 3600
    refresh_token_ttl: 1209600

permissions:
  defines:
    - code: com.ictrek.image-studio:image:generate
      name:
        zh-CN: 生成图片
        en: Generate Images
      description:
        zh-CN: 允许同账户应用调用 Image Studio 生成图片。
        en: Allows same-account apps to generate images through Image Studio.
      default_roles: [system_admin, platform_admin, normal_user]
    - code: com.ictrek.image-studio:model:manage
      name:
        zh-CN: 管理模型
        en: Manage Models
      description:
        zh-CN: 允许触发 Model Hub 模型下载和同步。
        en: Allows triggering Model Hub model pull and sync actions.
      default_roles: [system_admin, platform_admin]

profiles:
  - name: amd-cpu
    title:
      zh-CN: AMD64 CPU
      en: AMD64 CPU
    description:
      zh-CN: AMD64 平台，不声明 nvidia runtime，适合 CPU 或外部 runtime 测试。
      en: AMD64 platform without nvidia runtime, for CPU or external runtime testing.
    caps:
      arch: amd64
    conflicts: [amd-cuda, arm-cpu, arm-cuda, jetson-orin, jetson-thor, dgx-spark]
  - name: amd-cuda
    title:
      zh-CN: AMD64 CUDA
      en: AMD64 CUDA
    description:
      zh-CN: AMD64 NVIDIA CUDA 平台，声明 nvidia runtime。
      en: AMD64 NVIDIA CUDA platform with nvidia runtime.
    caps:
      arch: amd64
      software: [cuda]
    conflicts: [amd-cpu, arm-cpu, arm-cuda, jetson-orin, jetson-thor, dgx-spark]
  - name: arm-cpu
    title:
      zh-CN: ARM64 CPU
      en: ARM64 CPU
    description:
      zh-CN: ARM64 平台，不声明 nvidia runtime。
      en: ARM64 platform without nvidia runtime.
    caps:
      arch: arm64
    conflicts: [amd-cpu, amd-cuda, arm-cuda, jetson-orin, jetson-thor, dgx-spark]
  - name: arm-cuda
    title:
      zh-CN: ARM64 CUDA
      en: ARM64 CUDA
    description:
      zh-CN: ARM64 NVIDIA CUDA 平台，声明 nvidia runtime。
      en: ARM64 NVIDIA CUDA platform with nvidia runtime.
    caps:
      device-type: generic
      arch: arm64
      software: [cuda]
    conflicts: [amd-cpu, amd-cuda, arm-cpu, jetson-orin, jetson-thor, dgx-spark]
  - name: jetson-orin
    title:
      zh-CN: Jetson Orin
      en: Jetson Orin
    description:
      zh-CN: Jetson Orin 平台，声明 nvidia runtime。
      en: Jetson Orin platform with nvidia runtime.
    caps:
      device-type:
        - any-of: [jetson-orin, l4t, jetson]
      arch: arm64
      software: [cuda]
    conflicts: [amd-cpu, amd-cuda, arm-cpu, arm-cuda, jetson-thor, dgx-spark]
  - name: jetson-thor
    title: {zh-CN: Jetson Thor, en: Jetson Thor}
    description: {zh-CN: Jetson Thor CUDA 加速。, en: Jetson Thor CUDA acceleration.}
    caps:
      device-type:
        - any-of: [jetson-thor, thor, thor-spark]
      arch: arm64
      software: [cuda]
    conflicts: [amd-cpu, amd-cuda, arm-cpu, arm-cuda, jetson-orin, dgx-spark]
  - name: dgx-spark
    title: {zh-CN: DGX Spark, en: DGX Spark}
    description: {zh-CN: NVIDIA GB10 CUDA 加速。, en: NVIDIA GB10 CUDA acceleration.}
    caps:
      device-type:
        - any-of: [dgx-spark, spark]
      arch: arm64
      software: [cuda]
    conflicts: [amd-cpu, amd-cuda, arm-cpu, arm-cuda, jetson-orin, jetson-thor]

require-profiles: true

storage:
  directories:
    - path: data
      mode: "0755"
