name: image-studio-dev

# 容器内热加载调试：CUDA 版 sd-cli + 源码挂载 + uvicorn --reload
#   make dev          # 前台启动（OPTS=-d 后台）
#   make dev-build    # 只构建镜像
#   make dev-shell    # 进容器调试（sd-cli / python / uv）
# 前端仍在宿主机跑：BACKEND_ORIGIN=http://127.0.0.1:25050 bun dev

services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
      args:
        GITHUB_ACCELERATOR: ${GITHUB_ACCELERATOR:-https://gh-proxy.com/}
        UV_INDEX_URL: ${UV_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple/}
    image: image-studio-backend:dev-amd-cuda
    container_name: image-studio-dev
    ports:
      - "${IMAGE_STUDIO_PORT:-25050}:25050"
    volumes:
      # 源码热加载（改 app/ 下任意 .py 即触发 uvicorn reload）
      - ../app:/app/app
      - ../pyproject.toml:/app/pyproject.toml:ro
      - ../uv.lock:/app/uv.lock:ro
      - ../tests:/app/tests:ro
      - ../scripts:/app/scripts:ro
      # 应用数据：会话/任务/上传图/输出
      - ${DEV_DATA_DIR:-../.data}:/data
      # 共享模型库（与 VOS Model Hub 同一目录，已下载模型直接 ready）
      - ${MODEL_HUB_PATH:-/data/vos_workspace/public/model_hub}:/modelhub
      # 依赖持久化，重启不重装
      - image-studio-dev-venv:/app/.venv
    environment:
      IMAGE_STUDIO_APP_VERSION: "0.1.0-dev"
      IMAGE_STUDIO_PROFILE: amd-cuda
      IMAGE_STUDIO_DATA_DIR: /data
      MODEL_HUB_SHARED_MODELS_PATH: /modelhub
      MODEL_HUB_API_URL: ${MODEL_HUB_API_URL:-http://model-hub-backend:5005}
      # 开发机不经过 VOS 网关
      IMAGE_STUDIO_VOS_SSO_ENABLED: "false"
      IMAGE_STUDIO_HF_ENDPOINT: https://hf-mirror.com
      SD_CPP_BIN: sd-cli
      IMAGE_STUDIO_MOCK_WHEN_RUNTIME_MISSING: "false"
      IMAGE_STUDIO_MAX_CONCURRENCY: ${IMAGE_STUDIO_MAX_CONCURRENCY:-1}
      IMAGE_STUDIO_GENERATE_TIMEOUT_SECONDS: ${IMAGE_STUDIO_GENERATE_TIMEOUT_SECONDS:-900}
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      PYTHONUNBUFFERED: "1"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
    command:
      - bash
      - -c
      - |
        set -e
        # 依赖与 uv.lock 对齐（已装时秒级完成）
        uv sync --frozen --no-install-project
        sd-cli --help >/dev/null && echo "[dev] sd-cli ready"
        exec uvicorn app.main:app --host 0.0.0.0 --port 25050 --reload --reload-dir /app/app

volumes:
  image-studio-dev-venv:
